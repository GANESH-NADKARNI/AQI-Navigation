<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>EcoNav — Clean Air Navigation</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>

<link rel="stylesheet" href="css/main.css" />
</head>
<body>

<!-- ══════════════════════════════════════
     HEADER
══════════════════════════════════════ -->
<header id="app-header">
  <div class="header-left">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M12 2C8 2 4 5.5 4 10c0 6 8 12 8 12s8-6 8-12c0-4.5-4-8-8-8z" fill="url(#lg)"/>
        <circle cx="12" cy="10" r="3" fill="white" opacity=".9"/>
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#06b6d4"/>
          <stop offset="100%" stop-color="#22c55e"/>
        </linearGradient></defs>
      </svg>
      EcoNav
    </div>
  </div>
  <div class="header-center" id="header-mini" style="display:none">
    <span class="mini-orig" id="mini-origin"></span>
    <span class="mini-arr">›</span>
    <span id="mini-dest"></span>
  </div>
  <div class="header-right">
    <div class="aqi-pill" id="header-aqi-pill">
      <div class="aqi-dot" id="header-aqi-dot"></div>
      <span id="header-aqi-text">Fetching AQI…</span>
    </div>
    <div class="model-badge" id="model-badge" title="Model status">⚙</div>
  </div>
</header>

<!-- ══════════════════════════════════════
     MAP
══════════════════════════════════════ -->
<div id="map"></div>

<!-- Re-centre button (hidden until user pans) -->
<button id="recentre-btn" onclick="Navigation.recentreOnUser()">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
    <circle cx="12" cy="12" r="10"/>
    <circle cx="12" cy="12" r="3" fill="currentColor"/>
    <line x1="12" y1="2"  x2="12" y2="5"/>
    <line x1="12" y1="19" x2="12" y2="22"/>
    <line x1="2"  y1="12" x2="5"  y2="12"/>
    <line x1="19" y1="12" x2="22" y2="12"/>
  </svg>
  Re-centre
</button>

<!-- ══════════════════════════════════════
     SEARCH SHEET
══════════════════════════════════════ -->
<div id="search-sheet" class="sheet">
  <div class="sheet-handle"></div>

  <div class="search-inputs">
    <div class="input-row">
      <div class="route-dot blue"></div>
      <input type="text" id="origin-input" placeholder="Your location" autocomplete="off"/>
      <button class="icon-btn" id="use-location-btn" title="Use my location">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/>
          <line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/>
          <line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/>
        </svg>
      </button>
    </div>
    <div class="input-connector-line"></div>
    <div class="input-row">
      <div class="route-dot green"></div>
      <input type="text" id="dest-input" placeholder="Choose destination" autocomplete="off"/>
      <button class="icon-btn" id="clear-dest-btn" title="Clear">✕</button>
    </div>
  </div>

  <div id="autocomplete-panel" style="display:none">
    <div class="autocomplete-list" id="autocomplete-list"></div>
  </div>

  <!-- Route cards -->
  <div id="route-cards" style="display:none">
    <div class="route-toggle">
      <button class="route-btn active blue-route" id="btn-shortest" data-route="shortest">
        <span class="rbtn-icon">🔵</span>
        <div><div class="rbtn-title">Shortest</div><div class="rbtn-sub" id="sub-shortest">—</div></div>
      </button>
      <button class="route-btn" id="btn-eco" data-route="eco">
        <span class="rbtn-icon">🟢</span>
        <div><div class="rbtn-title">Clean Air</div><div class="rbtn-sub" id="sub-eco">—</div></div>
      </button>
    </div>

    <div class="route-detail-card" id="route-detail-card">
      <div class="route-stats">
        <div class="stat"><div class="stat-val" id="stat-dist">—</div><div class="stat-lbl">Distance</div></div>
        <div class="stat"><div class="stat-val" id="stat-dur">—</div><div class="stat-lbl">Duration</div></div>
        <div class="stat"><div class="stat-val" id="stat-aqi">—</div><div class="stat-lbl">Avg AQI</div></div>
      </div>
      <div class="route-aqi-badge" id="route-aqi-badge"></div>
    </div>

    <button class="go-btn" id="go-btn">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="white">
        <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/>
      </svg>
      Start Navigation
    </button>
  </div>

  <!-- AQI Prediction -->
  <div class="panel-toggle" id="pred-toggle" onclick="togglePredPanel()">
    <span>🔮 AQI Forecast</span>
    <span class="chevron" id="pred-chevron">▾</span>
  </div>
  <div id="pred-panel" style="display:none"></div>
</div>

<!-- ══════════════════════════════════════
     NAVIGATION OVERLAY
     (exactly like the screenshot you sent)
══════════════════════════════════════ -->
<div id="nav-overlay" style="display:none">

  <!-- 1. Main instruction (green bar like Google Maps) -->
  <div id="nav-instr-bar">
    <div id="nav-maneuver-icon">↑</div>
    <div id="nav-instr-center">
      <div id="nav-instruction-text">Preparing…</div>
      <div id="nav-road-bar"></div>
    </div>
    <div id="nav-dist-badge">—</div>
  </div>

  <!-- 2. "Then →" preview bar -->
  <div id="nav-then-bar">Then…</div>

  <!-- 3. Right-side floating controls (like Google Maps) -->
  <div id="nav-side-controls">
    <button class="nav-fab" id="nav-search-fab" title="Search along route">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </button>
    <button class="nav-fab" id="nav-voice-btn" onclick="Navigation.toggleMute()">🔊</button>
    <button class="nav-fab" id="nav-steps-fab" onclick="Navigation.toggleSteps()" title="Steps">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="3" y1="6"  x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
  </div>

  <!-- 4. Bottom HUD (ETA · distance · AQI + X and route switch) -->
  <div id="nav-bottom-bar">
    <button id="nav-exit-btn" onclick="Navigation.stop()">✕</button>
    <div id="nav-hud-center">
      <div id="hud-duration-big" class="hud-big"></div>
      <div id="hud-detail-row">
        <span id="hud-dist">—</span>
        <span class="hud-dot">•</span>
        <span id="hud-eta">—</span>
      </div>
      <div id="hud-aqi-row">
        <span id="hud-aqi">—</span>
        <span id="hud-aqi-bucket"></span>
      </div>
    </div>
    <button id="nav-route-switch-btn" title="Switch route">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="16 3 21 8 16 13"/><line x1="21" y1="8" x2="3" y2="8"/>
        <polyline points="8 21 3 16 8 11"/><line x1="3" y1="16" x2="21" y2="16"/>
      </svg>
    </button>
  </div>

  <!-- Progress bar -->
  <div id="nav-progress-bar"><div id="nav-progress-fill"></div></div>

  <!-- 5. Step list panel (slide up on tap) -->
  <div id="nav-steps-panel">
    <div class="steps-handle" onclick="Navigation.toggleSteps()"></div>
    <div id="nav-steps-list"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/map.js"></script>
<script src="js/geocoding.js"></script>
<script src="js/routing.js"></script>
<script src="js/navigation.js"></script>
<script src="js/prediction.js"></script>
<script src="js/app.js"></script>
</body>
</html>
